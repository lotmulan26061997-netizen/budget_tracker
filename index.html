<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <h1>Budget Tracker<br><span class="mu">កម្មវិធីតាមដានថវិកា</span></h1>
      <div class="auth-tabs">
        <button class="on" onclick="authTab('login')">Log in</button>
        <button onclick="authTab('signup')">Sign up</button>
      </div>
      <form id="auth-form" onsubmit="return handleAuth(event)">
        <label>Email</label>
        <input type="email" id="auth-email" required placeholder="you@example.com">
        <label>Password</label>
        <input type="password" id="auth-pass" required placeholder="••••••••" minlength="6">
        <button class="btn" type="submit" id="auth-btn">Log in</button>
        <div class="mu" id="auth-msg"></div>
      </form>
      <button class="btn s" onclick="useOffline()" style="margin-top:8px;width:100%">Use offline (localStorage only)</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" style="display:none">
    <div class="w">
      <div class="header-row">
        <div>
          <h1>Budget Tracker · កម្មវិធីតាមដានថវិកា</h1>
          <div class="mu">Payday on the 2nd · savings target and totals update automatically</div>
        </div>
        <div id="user-bar"></div>
      </div>
      <nav id="nav"></nav>
      <div id="v"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
