<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Waypoint Budget · កម្មវិធីតាមដានថវិកា</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c1019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Waypoint">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div class="brand-badge-lg">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m16 8-8 8"/><path d="M8 8h8v8"/></svg>
        </div>
        <div>
          <h2>Waypoint Budget</h2>
          <span class="mu-text">កម្មវិធីតាមដានថវិកា</span>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="active" onclick="authTab('login')">Log in</button>
        <button onclick="authTab('signup')">Sign up</button>
      </div>

      <form id="auth-form" onsubmit="return handleAuth(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-pass" required placeholder="••••••••" minlength="6">
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="auth-btn">Log In</button>
        <div class="form-msg" id="auth-msg"></div>
      </form>

      <div class="auth-divider"><span>OR</span></div>
      <button class="btn btn-ghost btn-block" onclick="useOffline()">Use Offline (LocalStorage)</button>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="app" class="app-layout" style="display:none">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m16 8-8 8"/><path d="M8 8h8v8"/></svg>
          </div>
          <div class="brand-info">
            <span class="brand-title">Waypoint</span>
            <span class="brand-sub">Budget Tracker</span>
          </div>
        </div>
      </div>

      <!-- User Profile Card (Above + Add New, Matches Image 1) -->
      <div class="user-top-profile">
        <div class="avatar-upload-wrapper" onclick="document.getElementById('avatar-file-input').click()" title="Click to upload profile photo">
          <div class="avatar-img-container" id="profile-avatar-container">
            <span class="avatar-fallback" id="profile-avatar-fallback">U</span>
            <img id="profile-avatar-img" class="avatar-photo" style="display:none;" alt="Profile Picture">
          </div>
          <div class="avatar-camera-badge" title="Change photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <input type="file" id="avatar-file-input" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
        </div>
        <div class="profile-info">
          <span class="profile-name" id="profile-name">Guest User</span>
          <span class="profile-role">
            <span class="sync-dot" id="top-sync-dot"></span>
            <span id="top-sync-text">Connected</span>
          </span>
        </div>
      </div>

      <div class="sidebar-action">
        <button class="btn btn-add-new" onclick="openAddModal()">
          <span class="plus-icon">+</span>
          <span>Add New</span>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">OVERVIEW</div>
        <button class="nav-item active" data-tab="dash" onclick="switchTab('dash')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard · ផ្ទាំងគ្រប់គ្រង</span>
        </button>
        <button class="nav-item" data-tab="txs" onclick="switchTab('txs')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
          <span>Transactions · ប្រតិបត្តិការ</span>
        </button>
        <button class="nav-item" data-tab="sum" onclick="switchTab('sum')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Summary · សង្ខេប</span>
        </button>

        <div class="nav-section-label">PREFERENCES</div>
        <button class="nav-item" data-tab="set" onclick="switchTab('set')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Settings · ការកំណត់</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item logout-btn" onclick="handleLogout()">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          <span>Log Out · ចាកចេញ</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content">
      
      <!-- Top Mobile Bar -->
      <header class="top-bar">
        <div class="mobile-brand">
          <div class="mobile-avatar-wrap" onclick="document.getElementById('avatar-file-input').click()" title="Change photo">
            <span class="mobile-avatar-fallback" id="mobile-avatar-fallback">U</span>
            <img id="mobile-avatar-img" class="mobile-avatar-img" style="display:none;" alt="Avatar">
          </div>
          <div>
            <span class="mobile-title">Waypoint</span>
            <div class="mobile-sync">
              <span class="sync-dot" id="mobile-sync-dot"></span>
              <span id="mobile-sync-text">Connected</span>
            </div>
          </div>
        </div>
        <div class="top-bar-actions">
          <button id="pwa-install-btn" class="btn btn-ghost btn-sm pwa-btn" style="display:none;" onclick="triggerPwaInstall()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span>Install</span>
          </button>
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add</button>
        </div>
      </header>

      <!-- View Container (rendered dynamically) -->
      <div id="v" class="view-content"></div>

      <!-- Mobile Bottom Navigation Bar (Native App Feel) -->
      <nav class="mobile-bottom-nav">
        <button class="bnav-item active" data-tab="dash" onclick="switchTab('dash')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="bnav-item" data-tab="txs" onclick="switchTab('txs')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
          <span>Activity</span>
        </button>
        <button class="bnav-item fab-center" onclick="openAddModal()" title="Add Transaction">
          <div class="fab-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          </div>
        </button>
        <button class="bnav-item" data-tab="sum" onclick="switchTab('sum')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Summary</span>
        </button>
        <button class="bnav-item" data-tab="set" onclick="switchTab('set')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

    </main>
  </div>

  <!-- Add Entry Modal -->
  <div id="add-modal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeAddModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>New Transaction · ការបញ្ចូលថ្មី</h3>
        <button class="close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      <div class="modal-body">
        
        <!-- Type Selection Tabs -->
        <div class="type-selector">
          <button type="button" class="type-btn active" data-type="out" onclick="setType('out')">
            <span class="type-icon red">↓</span>
            <span>Expense · ចំណាយ</span>
          </button>
          <button type="button" class="type-btn" data-type="in" onclick="setType('in')">
            <span class="type-icon green">↑</span>
            <span>Income · ចំណូល</span>
          </button>
          <button type="button" class="type-btn" data-type="sv" onclick="setType('sv')">
            <span class="type-icon blue">🏦</span>
            <span>Savings · សន្សំ</span>
          </button>
        </div>

        <!-- Category Grid / Pills with Icons -->
        <div class="form-group">
          <label>Select Category · ជ្រើសរើសប្រភេទ</label>
          <div id="category-pills" class="category-pills-grid"></div>
        </div>

        <div class="form-row">
          <div class="form-group col-6">
            <label>Amount ($)</label>
            <div class="input-prefix">
              <span>$</span>
              <input id="modal-amount" type="number" step="0.01" min="0" placeholder="0.00" required autofocus>
            </div>
          </div>
          <div class="form-group col-6">
            <label>Date · កាលបរិច្ឆេទ</label>
            <input id="modal-date" type="date">
          </div>
        </div>

        <div class="form-group">
          <label>Note (Optional) · ចំណាំ</label>
          <input id="modal-note" type="text" placeholder="e.g. Electricity bill, salary bonus..." maxlength="80">
        </div>

        <div id="modal-msg" class="form-msg"></div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeAddModal()">Cancel</button>
        <button class="btn btn-primary" id="modal-submit-btn" onclick="submitModalEntry()">Save Transaction</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
